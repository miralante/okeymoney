<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Okeymoney — billete">
  <title>Okeymoney</title>
  <!-- Billete verde (#2E7D32, el --accent de tokens.css) con banda
       dorada (#B8860B, el --accent-2) y símbolo € grande en blanco.
       Sin fondo de marca: la app usa este SVG dentro del header sobre
       el fondo --color-bg (#FAF7F2), y la landing lo usa dentro del
       chip --accent-soft (#E3EEF6). En ambos casos queda limpio. -->
  <rect x="12" y="28" width="76" height="44" rx="6" fill="#2E7D32"/>
  <rect x="20" y="36" width="14" height="28" rx="3" fill="#B8860B"/>
  <text x="68" y="62" text-anchor="middle" font-family="'Nunito', Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">€</text>
</svg>
