# Canonical CI gate for the Miralante suite — Okeymoney flavour.
#
# Runs the project's structural and i18n checks plus the sw.js
# VERSION bump gate on every push and PR against master/main.
# Deploy is handled by the Cloudflare Git connector reading _headers
# from the repo root; this workflow does not deploy.
#
# Structural checks run with plain node and stdlib modules. The UI
# smoke job installs the package's Playwright dev dependency and
# Chromium separately.
#
# Job list:
#   1. check      — runs scripts/check.js (structural + i18n).
#   2. cache-bump — runs scripts/check-version-bump.js. Fails the
#                    PR if a sw.js-cached file changed but VERSION
#                    was not bumped (see CLAUDE.md §B.1).
name: Validate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node scripts/check.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run structural and i18n checks
        run: node scripts/check.js

  cache-bump:
    name: sw.js VERSION bump check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify VERSION was bumped when a cached file changed
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'HEAD~1') || github.event.before }}
        run: node scripts/check-version-bump.js

  ui-smoke:
    name: Playwright UI and service-worker smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI smoke
        run: npm run test:ui

      - name: Run service-worker smoke
        run: npm run test:sw
