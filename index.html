       so LLMs/Google classify it correctly in finance queries. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "SoftwareApplication",
        "@id": "https://okeymoney.apptonomia.uk/#app",
        "name": "Okeymoney",
        "url": "https://okeymoney.apptonomia.uk/",
        "applicationCategory": "FinanceApplication",
        "applicationSubCategory": "Educación financiera",
        "operatingSystem": "Web",
        "inLanguage": ["es", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "description": "Aprende a manejar el dinero cotidiano: saldo, gastos, metas de ahorro y un asistente guiado paso a paso.",
        "parentOrganization": { "@id": "https://apptonomia.uk/#org" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Apptonomia", "item": "https://apptonomia.uk/" },
          { "@type": "ListItem", "position": 2, "name": "Okeymoney", "item": "https://okeymoney.apptonomia.uk/" }
        ]
      }
    ]
  }
  </script>

  <link rel="stylesheet" href="assets/css/tokens.css">

<body data-tema="dinero">
  <!--
    Home unificado (Fase 3 de PRODUCT-DESIGN.md + estilo visual
    alineado con el hermano Routime): cabecera tipo catálogo
    (idioma + marca + saludo), barra
    de anclas a cada módulo temático y, debajo, tres tarjetas
    grandes (Mi dinero · Mis metas · catálogo de actividades)
    en un único scroll. Sin tabbar: el FAB flotante "Apuntar
    un gasto" vive abajo a la derecha.
    Los monederos de práctica (🔑) no aparecen como tarjetas
    propias — el contador 🪙 de práctica vive en la cabecera de cada
    el saldo de práctica; el detalle vive dentro de cada tool.
  -->
  <div class="container" id="app">

    <header class="cabecera centrado">
      <div class="idioma-selector" id="langRow" role="group" aria-label="Elegir idioma">
        <!-- buttons injected by app.js init() from App.i18n.SUPPORTED -->
      </div>
      <img src="assets/img/icono.svg" alt="" width="72" height="72" class="logo">
      <h1 data-i18n="appName">Okeymoney</h1>
      <div class="fila centrado-fila">
        <p class="saludo" id="saludo" data-i18n="home.saludo">Hola. ¿Qué quieres hacer hoy?</p>
      </div>
    </header>

    <!-- Anclas a cada módulo temático del catálogo de actividades. -->
    <nav class="anclas-modulo" aria-label="Ir a un módulo" id="anclasModulo"></nav>

    <main class="pila modulos">

      <!-- Bloque 1: Mi dinero — tarjeta grande con el saldo real. -->
      <a href="#" class="tarjeta tarjeta--money" id="tarjetaSaldo" style="--acento: var(--acento); --acento-suave: var(--acento-suave);">
        <span class="picto" aria-hidden="true">💶</span>
        <span class="tarjeta__etiqueta" data-i18n="home.balanceLabel">Tienes</span>
        <span class="tarjeta__nombre" id="balanceValue">0,00 €</span>
        <span class="tarjeta__detalle" data-i18n="home.editHint">Toca para cambiar cuánto dinero tienes</span>
        <span class="tarjeta__estado" aria-hidden="true" id="recentesResumen"></span>
      </a>

      <!-- Bloque 2: Mis metas — tarjeta grande con hasta 3 metas en preview. -->
      <a href="#" class="tarjeta tarjeta--goals" id="tarjetaMetas" style="--acento: var(--acento-2); --acento-suave: var(--acento-2-suave);">
        <span class="picto" aria-hidden="true">🐷</span>
        <span class="tarjeta__etiqueta" data-i18n="goals.title">Mis metas</span>
        <span class="tarjeta__detalle" id="metasResumen" data-i18n="goals.empty">Todavía no tienes ninguna meta. ¡Crea la primera!</span>
        <span class="tarjeta__estado" aria-hidden="true" id="metasCta" data-i18n="goals.newButton">+ Nueva meta</span>
      </a>

      <!-- Bloque 3: catálogo de actividades de práctica, en orden temático
           pedagógico (conceptos básicos → vida cotidiana → seguridad). Cada
           .tarjeta dentro de un .modulo se pinta por activity-runtime.js
           (estructura picto + nombre + detalle + estado ✓/▶/🔒). -->
      <section id="aprende" class="modulo modulo--catalogo" style="--acento: var(--acento-3); --acento-suave: var(--acento-3-suave);">
        <h2><span aria-hidden="true" data-i18n="home.catalogueTitle">Aprende con Okeymoney</span></h2>
        <div id="homeActivities" class="grid-tarjetas"></div>
      </section>

    </main>

    <!-- Pantalla del wizard paso a paso (registrar gasto / nueva meta /
         añadir dinero a meta / cambiar saldo). Solo se muestra mientras
         hay un wizard abierto; el resto del tiempo está oculto. -->
    <section id="screen-wizard" class="stack hidden" aria-live="polite"></section>

    <div class="footer-app">
      <a class="legal-link" href="legal/index.html" data-i18n="core.dataProtection">Protección de datos</a>
    </div>

  </div>

  <!-- FAB flotante: única entrada a "Apuntar un gasto" (dinero real).
       Vive fuera de la barra inferior (el tabbar se eliminó en Fase 3). -->
  <button type="button" class="fab-flotante" id="btnNewExpense" data-i18n-aria="tabs.newExpenseAria" aria-label="Apuntar un gasto">+</button>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
