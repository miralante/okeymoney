<!DOCTYPE html>
<html lang="es" data-i18n-title="personal.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okeymoney</title>
  <!-- Hidden route: not linked from the main menu and should not be indexed.
       It only restores the text size and the language to their defaults. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/locale-picker.css">
</head>
<body>
  <div class="container settings">
    <header class="cabecera-settings">
      <div data-suite-header data-suite-logo="../assets/img/icono-euro.svg" data-suite-name="Okeymoney" data-suite-byline></div>
      <p class="aviso-ruta" data-i18n="personal.routeNotice">Página de ajustes. No aparece en el menú de la aplicación: solo se llega escribiendo esta dirección.</p>
      <h1 data-i18n="personal.title">Borrar los datos de la persona</h1>
    </header>

    <main class="suite-body stack">
      <section id="datos-persona" class="card guia">
        <p data-i18n="personal.intro">Borra el tamaño del texto y la preferencia de idioma. Se conservan el saldo, los movimientos, las metas y los compromisos.</p>
        <button type="button" id="btnBorrarPersona" class="btn btn-secondary" data-i18n="personal.button">Borrar mis datos personales</button>
        <p id="feedbackPersona" class="feedback" aria-live="polite"></p>
      </section>
    </main>
  <footer data-suite-footer data-suite-base="../"></footer>
  </div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="app.js"></script>
  <script src="../assets/js/locale-picker-config.js"></script>
  <script src="../assets/js/locale-picker.js" defer></script>
  <script src="../assets/js/suite-chrome.js"></script>
  <script src="../assets/js/sw-register.js"></script>
</body>
</html>
